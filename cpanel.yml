deployment:
  tasks:
    - export DEPLOYPATH=/home/zentek/public_html/
    # rsync (not `cp -R *`) so dotfiles like .htaccess are deployed, while the
    # server-side secrets and the claims records are never touched by a deploy.
    - /usr/bin/rsync -a --exclude='.git/' --exclude='.gitignore' --exclude='.vscode/' --exclude='config.smtp.php' --exclude='config.tienda.php' --exclude='reclamaciones/' --exclude='images/tienda-productos/' --exclude='cpanel.yml' --exclude='*.md' --exclude='optimize_assets.py' --exclude='src/' --exclude='build.php' --exclude='docs/' --exclude='assets/' --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='tailwind.config.js' --exclude='build/' ./ "$DEPLOYPATH"
