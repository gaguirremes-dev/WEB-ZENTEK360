deployment:
  tasks:
    - export DEPLOYPATH=/home/zentek/public_html/
    # rsync (not `cp -R *`) so dotfiles like .htaccess are deployed, while the
    # server-side secrets and the claims records are never touched by a deploy.
    - /usr/bin/rsync -a --exclude='.git/' --exclude='.gitignore' --exclude='.vscode/' --exclude='config.smtp.php' --exclude='reclamaciones/' --exclude='cpanel.yml' --exclude='*.md' --exclude='optimize_assets.py' ./ "$DEPLOYPATH"
